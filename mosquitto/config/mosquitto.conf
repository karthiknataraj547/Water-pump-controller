# Mosquitto 2.0 Configuration for IoT Water Pump Platform

# Standard MQTT listener (ESP32, Backend services, Simulator)
listener 1883
protocol mqtt
allow_anonymous true

# WebSockets listener (Flutter Web, Dashboards, Mobile WebSocket bridges)
listener 9001
protocol websockets
allow_anonymous true

# Persistence configuration
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# Connection limits & performance
max_connections -1
max_queued_messages 1000
set_tcp_nodelay true
